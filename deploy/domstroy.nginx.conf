# Реверс-прокси nginx для приложения DomStroy (Next.js на localhost:4000).
# server_name "_" - катч-олл: конфиг сработает и по IP, и по любому домену,
# пока не привязан конкретный домен. Когда появится домен, поменяйте
# "server_name _;" на "server_name your-domain.ru www.your-domain.ru;"
# и добавьте HTTPS (например, через certbot).

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Поддержка websocket/HMR-соединений
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
    }
}
