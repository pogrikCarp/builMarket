# Базовый (HTTP-only) конфиг nginx для DomStroy. Используется, пока ещё нет
# SSL-сертификата. Как только certbot выпустит сертификат, деплой-скрипт
# автоматически переключит сайт на domstroy.nginx-ssl.conf (с HTTPS).
# Путь /.well-known/acme-challenge/ нужен certbot для подтверждения домена.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name marketdomstroy.ru www.marketdomstroy.ru;

    client_max_body_size 25m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        # domstroy_upstream определяется в /etc/nginx/conf.d/domstroy-upstream.conf,
        # который переписывает deploy.sh при каждом blue-green переключении версии -
        # см. scripts/deploy.sh. Порт здесь никогда не хардкодится.
        proxy_pass http://domstroy_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Поддержка websocket/HMR-соединений
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
    }
}
