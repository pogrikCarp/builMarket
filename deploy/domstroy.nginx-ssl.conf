# Конфиг nginx для DomStroy с HTTPS (Let's Encrypt). Деплой-скрипт
# автоматически подключает этот файл вместо domstroy.nginx.conf, как только
# сертификат для marketdomstroy.ru получен (см. функцию ensure_ssl).

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name marketdomstroy.ru www.marketdomstroy.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name marketdomstroy.ru www.marketdomstroy.ru;

    ssl_certificate /etc/letsencrypt/live/marketdomstroy.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/marketdomstroy.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Поддержка websocket/HMR-соединений
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
    }
}
