# Конфиг nginx для DomStroy с HTTPS (Let's Encrypt). Деплой-скрипт
# автоматически подключает этот файл вместо domstroy.nginx.conf, как только
# сертификат для marketdomstroy.ru получен (см. функцию ensure_ssl).

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name marketdomstroy.ru www.marketdomstroy.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name marketdomstroy.ru www.marketdomstroy.ru;

    ssl_certificate /etc/letsencrypt/live/marketdomstroy.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/marketdomstroy.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 25m;

    # Загрузки админ-панели появляются после запуска Next.js.
    location /uploads/ {
        alias /opt/domstroy/shared/uploads/;
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
    }

    # Фотографии товаров из локального зеркала каталога (catalog-images.ts).
    # Имя файла содержит хэш исходной ссылки, поэтому можно кэшировать надолго.
    location /catalog-images/ {
        alias /opt/domstroy/shared/catalog-images/;
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        # domstroy_upstream определяется в /etc/nginx/conf.d/domstroy-upstream.conf,
        # который переписывает deploy.sh при каждом blue-green переключении версии -
        # см. scripts/deploy.sh. Порт здесь никогда не хардкодится.
        proxy_pass http://domstroy_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Поддержка websocket/HMR-соединений
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
    }
}
