name: CI & Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_DIR: /opt/domstroy

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Ставит все зависимости "с нуля" на каждый коммит - ловит новые/сломанные пакеты
      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      # Есть заранее известные (legacy) ошибки линта в проекте - не блокируем деплой,
      # но результат виден в логах CI
      - name: Lint (non-blocking)
        run: npm run lint
        continue-on-error: true

      # Полная сборка проекта - ловит ошибки типов и build-time ошибки до деплоя
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: "postgresql://user:pass@localhost:5432/ci_placeholder"
          AUTH_SECRET: "ci-placeholder-secret"

  deploy:
    needs: quality-checks
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      # ВРЕМЕННЫЙ диагностический шаг: проверяет, что приватный ключ из секрета
      # SSH_KEY валиден, и печатает соответствующий публичный ключ (не секретный),
      # чтобы свериться с authorized_keys на сервере. Удалить после диагностики.
      - name: Debug SSH key format
        run: |
          echo "--- Проверка формата приватного ключа ---"
          if ssh-keygen -y -f ~/.ssh/id_ed25519 > /tmp/derived_pub.txt; then
            echo "Ключ валиден. Публичный ключ, соответствующий приватному из секрета SSH_KEY:"
            cat /tmp/derived_pub.txt
          else
            echo "ОШИБКА: приватный ключ из секрета SSH_KEY невалиден (не парсится ssh-keygen)."
            echo "Скорее всего, при копировании в GitHub Secrets ключ обрезался или переносы строк побились."
            exit 1
          fi
          echo "--- Попытка подключения с подробным выводом ---"
          ssh -vvv -o BatchMode=yes -o ConnectTimeout=10 -p "${{ secrets.SSH_PORT }}" -i ~/.ssh/id_ed25519 \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" "echo OK" || true

      - name: Ensure remote project directory
        run: |
          ssh -p "${{ secrets.SSH_PORT }}" -i ~/.ssh/id_ed25519 "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "mkdir -p ${{ env.APP_DIR }} && chown root:root ${{ env.APP_DIR }} && chmod 755 ${{ env.APP_DIR }}"

      # Синхронизируем только исходники: node_modules/.next/.env на сервере не трогаем
      - name: Sync project to server
        run: |
          rsync -az --delete \
            --exclude ".git" \
            --exclude "node_modules" \
            --exclude ".next" \
            --exclude ".env" \
            --exclude "prisma/dev.db" \
            --exclude "public/uploads" \
            -e "ssh -p ${SSH_PORT} -i ~/.ssh/id_ed25519" \
            ./ "${SSH_USER}@${SSH_HOST}:${APP_DIR}"
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}

      # Идемпотентный скрипт: ставит зависимости, применяет миграции, собирает,
      # обновляет systemd unit и перезапускает сервис
      - name: Run deploy script on server
        run: |
          ssh -p "${{ secrets.SSH_PORT }}" -i ~/.ssh/id_ed25519 "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "bash ${{ env.APP_DIR }}/scripts/deploy.sh"

      - name: Verify service is active
        run: |
          ssh -p "${{ secrets.SSH_PORT }}" -i ~/.ssh/id_ed25519 "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "systemctl is-active --quiet domstroy && echo 'domstroy service is active'"
