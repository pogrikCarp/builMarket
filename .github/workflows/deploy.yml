name: CI & Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_DIR: /opt/domstroy

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Ставит все зависимости "с нуля" на каждый коммит - ловит новые/сломанные пакеты
      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      # Есть заранее известные (legacy) ошибки линта в проекте - не блокируем деплой,
      # но результат виден в логах CI
      - name: Lint (non-blocking)
        run: npm run lint
        continue-on-error: true

      # Полная сборка проекта - ловит ошибки типов и build-time ошибки до деплоя
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: "postgresql://user:pass@localhost:5432/ci_placeholder"
          AUTH_SECRET: "ci-placeholder-secret"

  deploy:
    needs: quality-checks
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Каждый деплой получает свой каталог releases/<release_id> на сервере -
      # это основа blue-green схемы в scripts/deploy.sh: новая версия
      # собирается и стартует рядом со старой, не затрагивая её, и трафик
      # переключается на неё только после успешного health-check.
      - name: Compute release id
        id: release
        run: echo "id=$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA:0:10}" >> "$GITHUB_OUTPUT"

      - name: Setup SSH key
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Ensure remote release directory
        run: |
          ssh -p "${{ secrets.SSH_PORT }}" -i ~/.ssh/id_ed25519 "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "mkdir -p ${{ env.APP_DIR }}/releases/${{ steps.release.outputs.id }} && chown root:root ${{ env.APP_DIR }} && chmod 755 ${{ env.APP_DIR }}"

      # Синхронизируем исходники в отдельный каталог релиза, а не поверх
      # работающей версии: node_modules/.next/.env там ещё нет - каждый релиз
      # ставит зависимости и собирается изолированно (см. build_release в
      # scripts/deploy.sh)
      - name: Sync project to server
        run: |
          rsync -az --delete \
            --exclude ".git" \
            --exclude "node_modules" \
            --exclude ".next" \
            --exclude ".env" \
            --exclude "prisma/dev.db" \
            --exclude "public/uploads" \
            -e "ssh -p ${SSH_PORT} -i ~/.ssh/id_ed25519" \
            ./ "${SSH_USER}@${SSH_HOST}:${APP_DIR}/releases/${RELEASE_ID}"
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          RELEASE_ID: ${{ steps.release.outputs.id }}

      # Идемпотентный blue-green деплой: собирает новый релиз, поднимает его
      # на неактивном порту, ждёт /api/health и только потом переключает
      # nginx. Если новая версия не поднимется - скрипт завершится ошибкой,
      # а сайт продолжит работать на старой версии без простоя.
      - name: Run deploy script on server
        run: |
          ssh -p "${{ secrets.SSH_PORT }}" -i ~/.ssh/id_ed25519 "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "bash ${{ env.APP_DIR }}/releases/${{ steps.release.outputs.id }}/scripts/deploy.sh ${{ steps.release.outputs.id }}"

      - name: Verify site responds over HTTPS
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 https://marketdomstroy.ru/)
          echo "HTTP status: $status"
          if [ "$status" -lt 200 ] || [ "$status" -ge 400 ]; then
            echo "Сайт не отвечает корректно после деплоя (status=$status)" >&2
            exit 1
          fi
