name: Apply adaptive TCP path MTU discovery

on:
  push:
    branches:
      - codex/vpn-connectivity
    paths:
      - scripts/ensure-tcp-mtu-probing.sh
      - .github/workflows/tcp-mtu-compatibility.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: domstroy-production-network
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: github.ref == 'refs/heads/codex/vpn-connectivity'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed network change
        uses: actions/checkout@v5

      - name: Enable adaptive TCP MTU with local health checks and rollback
        shell: bash
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          : "${SSH_KEY:?SSH_KEY is required}" "${SSH_HOST:?SSH_HOST is required}"
          : "${SSH_PORT:?SSH_PORT is required}" "${SSH_USER:?SSH_USER is required}"
          scratch_dir="$(mktemp -d "$RUNNER_TEMP/domstroy-network.XXXXXX")"
          cleanup() {
            rm -f -- "$scratch_dir/key" "$scratch_dir/known_hosts"
            rmdir -- "$scratch_dir"
          }
          trap cleanup EXIT
          umask 077
          printf '%s\n' "$SSH_KEY" > "$scratch_dir/key"
          chmod 600 "$scratch_dir/key"
          unset SSH_KEY
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" > "$scratch_dir/known_hosts" 2>/dev/null
          test -s "$scratch_dir/known_hosts"
          ssh -T -p "$SSH_PORT" -i "$scratch_dir/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$scratch_dir/known_hosts" \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=2 \
            "$SSH_USER@$SSH_HOST" 'bash -s -- --check-health' < scripts/ensure-tcp-mtu-probing.sh

      - name: Verify public HTTPS from the runner
        shell: bash
        run: |
          set -euo pipefail
          for host in marketdomstroy.ru www.marketdomstroy.ru; do
            for tls in 1.2 1.3; do
              status="$(curl --noproxy '*' --silent --show-error --connect-timeout 5 --max-time 20 \
                "--tlsv$tls" --tls-max "$tls" --output /dev/null --write-out '%{http_code}' \
                "https://$host/api/health")"
              printf 'host=%s TLS=%s HTTP=%s\n' "$host" "$tls" "$status"
              test "$status" = 200
            done
          done
